name: Independent package checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: connector-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      AIPOCH_GITHUB_TOKEN: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check contracts, isolated integrations and build
        run: npm run check
      - name: Pack and install in an independent directory
        run: node tests/package-smoke.mjs
